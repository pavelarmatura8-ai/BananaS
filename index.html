​\n- обеспечивает обозначение и ограждение места ДТП с целью предотвращения наезда на его участников, транспортные средства, участвовавшие в ДТП, и участников ликвидации последствий ДТП посредством конусов, а также размещения на проезжей части или обочине дороги патрульного автомобиля с включенными специальными световыми сигналами;\n- устанавливает наличие на месте ДТП водителей, транспортные средства которых участвовали в ДТП, и других причастных к нему лиц, осуществляет проверку документов у участников ДТП, обеспечивает присутствие указанных лиц на месте происшествия;\n- выявляет лиц, которым известны обстоятельства ДТП, и записывает их данные;\n- принимает меры к сохранности вещественных доказательств, следов, имущества, других предметов, в том числе видеорегистраторов, иных технических средств с функцией фотосъемки, аудио- и видеозаписи и зафиксированной ими информации, имеющей отношение к ДТП;\n- выясняет вероятное направление движения, марку, модель, цвет, государственный регистрационный номер транспортного средства, на котором водитель скрылся с места ДТП, а также особые приметы транспортного средства и водителя; данные о скрывшемся транспортном средстве и водителе докладывает дежурному (( объявляет в розыск ));\n- устанавливает и фиксирует причины и условия, способствовавшие совершению ДТП (в том числе относящиеся к техническому состоянию транспортных средств, эксплуатационному состоянию автомобильной дороги, дорожным условиям) путем изучения места ДТП при необходимости с использованием специальных технических средств, а также опроса его участников и свидетелей.​\n20. Оформление материалов по факту ДТП, на место совершения которого выезжал сотрудник (написание рапорта, получение объяснений, другие действия), осуществляется сотрудником на месте ДТП.\n\nГлава 7. Досмотр транспортного средства\n​21. Досмотр транспортного средства любого вида, то есть обследование транспортного средства, проводимое без нарушения его конструктивной целостности, осуществляется в целях обнаружения орудий совершения либо предметов административного правонарушения, в соответствии с действующим законодательством (в частности, Федеральным законом от 29.04.24 г. № 3-ФЗ "О полиции").\n22. Досмотр транспортного средства осуществляется в присутствии лица, во владении которого оно находится. В случаях, не терпящих отлагательства, досмотр транспортного средства может быть осуществлен в отсутствие указанного лица.​\n\nГлава 8. Задержание транспортного средства и перемещение на специализированную стоянку\n​23. В целях пресечения нарушений правил эксплуатации и управления транспортными средствами, предусмотренных Кодексом об административных правонарушениях, применяется задержание транспортного средства путем его перемещения на специализированную стоянку или прекращения движения блокирующими устройствами до устранения причин задержания.\n24. Основаниями для задержания транспортного средства являются:​\n- управление транспортным средством водителем, не имеющим при себе документов на право управления им, регистрационных документов на транспортное средство, а равно документов, подтверждающих право владения, пользования или распоряжения управляемым им транспортным средством в отсутствие его владельца;\n- управление транспортным средством водителем, не имеющим права управления транспортным средством (за исключением учебной езды);\n- управление транспортным средством водителем, находящимся в состоянии опьянения, либо употребление водителем алкогольных напитков, наркотических или психотропных веществ после ДТП, к которому он причастен, либо после того, как транспортное средство было остановлено по требованию сотрудника полиции, до проведения уполномоченным должностным лицом освидетельствования в целях установления состояния опьянения или до принятия уполномоченным должностным лицом решения об освобождении от проведения такого освидетельствования;\n- запрещенная пунктом 9.2 ПДД остановка или стоянка транспортного средства;\n- наличие транспортного средства в розыске.​\n25. Для задержания транспортного средства необходимо наличие видео или фотофиксации совершенного нарушения.\n26. При обнаружении транспортного средства, припаркованного с нарушением Правил дорожного движения, необходимо зафиксировать нарушение с помощью боди-камеры, обеспечить наличие видео- или фотофиксации, подготовить транспортное средство к эвакуации и выждать 3 минуты; в случае неявки владельца в течение этого времени эвакуация продолжается, и автомобиль доставляется на штрафстоянку.` },
            { title: 'Строевые команды', content: `Строевые команды.\n1. Команды «Становись» и «Смирно» применяются для принятия\nстроевой стойки.\n2. Команда «Вольно» применяется: для того,\nчтобы не сходя с места стать свободно, ослабить в колене правую или\nлевую ногу.\n3.Команда «Равнение на право/лево/середину»\nПо команде "Смирно" все сотрудники переходят на строевой шаг, а по команде "Равнение на-ПРАВО (на-ЛЕВО)" одновременно поворачивают голову в сторону начальника и прекращают движение руками или рукой, не занятой оружием.\n4.Отставить!\n(Команда отменяет последнее строевое действие)\n5.Строй, одну шеренгу становись!\n(Можно менять количество шеренг)\n6.Строй в две/три колонны(-у) становись!\n7.Граната в строю!\n(Команда дается для рассредоточения личного состава)\n8. Шагом марш!\n9. Строй, на месте стой! Раз, два.\n10. Левое-Правое Плечо впёрёд!\n(Если подаётся команда «Левое плечо вперёд!» значит Направляющий заворачивает на право, в случае с командой «Правое плечо вперёд!» Направляющий заворачивает на лево)\nРасшифровка строевых команд:\nСтрой - установленное Уставом размещение военнослужащих, подразделений и воинскиx частей для их совместных действий в пешем порядке и на машинах.\nШеренга - строй, в котором военнослужащие размещены один возле другого на одной линии на установленных интервалах.\nЛиния машин - строй, в котором машины размещены одна возле другой на одной линии.\nФланг - правая (левая) оконечность строя. При поворотах строя названия флангов не изменяются.\nФронт - сторона строя, в которую военнослужащие обращены лицом (машины - лобовой частью).\nТыльная сторона строя - сторона, противоположная фронту.\nИнтервал - расстояние по фронту между военнослужащими (машинами), подразделениями и воинскими частями.\nДистанция - расстояние в глубину между военнослужащими (машинами), подразделениями и воинскими частями.\nШирина строя - расстояние между флангами.\nГлубина строя - расстояние от первой шеренги (впереди стоящего военнослужащего) до последней шеренги (позади стоящего военнослужащего), а при действиях на машинах - расстояние от первой линии машин (впереди стоящей машины) до последней линии машин (позади стоящей машины).\nДвухшереножный строй - строй, в котором военнослужащие одной шеренги расположены в затылок военнослужащим другой шеренги на дистанции одного шага (вытянутой руки, наложенной ладонью на плечо впереди стоящего военнослужащего). Шеренги называются первой и второй. При повороте строя названия шеренг не изменяются.\nРяд - два военнослужащих, стоящих в двухшереножном строю в затылок один другому. Если за военнослужащим первой шеренги не стоит в затылок военнослужащий второй шеренги, такой ряд называется неполным. При повороте двухшереножного строя кругом военнослужащий неполного ряда переходит во впереди стоящую шеренгу.\nОдношереножный и двухшереножный строи могут быть сомкнутыми или разомкнутыми. В сомкнутом строю военнослужащие в шеренгах расположены по фронту один от другого на интервалах, равных ширине ладони между локтями. В разомкнутом строю военнослужащие в шеренгах расположены по фронту один от другого на интервалах в один шаг или на интервалах, указанных командиром.\nКолонна - строй, в котором военнослужащие расположены в затылок друг другу, а подразделения (машины) - одно за другим на дистанциях, установленных Уставом или командиром. Колонны могут быть по одному, по два, по три, по четыре и более. Колонны применяются для построения подразделений и воинских частей в развернутый или походный строй.\nРазвернутый строй - строй, в котором подразделения построены на одной линии по фронту в одношереножном или двухшереножном строю (в линию машин) или в линию колонн на интервалах, установленных Уставом или командиром. Развернутый строй, как правило, применяется для проведения проверок, расчетов, смотров, парадов, а также в других необходимых случаях.\nПоходный строй - строй, в котором подразделение построено в колонну или подразделения в колоннах построены одно за другим на дистанциях, установленных Уставом или командиром. Походный строй применяется для передвижения подразделений при совершении марша, прохождения торжественным маршем, с песней, а также в других необходимых случаях.\n15. Направляющий - военнослужащий (подразделение, машина), движущийся головным в указанном направлении. По направляющему сообразуют свое движение остальные военнослужащие (подразделения, машины).\nЗамыкающий - военнослужащий (подразделение, машина), движущийся последним в колонне.\n16. Управление строем осуществляется командами и приказаниями, которые подаются командиром голосом, сигналами и личным примером, а также передаются с помощью технических и подвижных средств.\nКоманды и приказания могут передаваться по колонне через командиров подразделений (старших машин) и назначенных наблюдателей.\nУправление в машине осуществляется командами и приказаниями, подаваемыми голосом и с помощью средств внутренней связи.\nВ строю старший командир находится там, откуда ему удобнее командовать. Остальные командиры подают команды, оставаясь на местах, установленных Уставом или старшим командиром. Командирам подразделений от роты и выше в походном строю батальона и полка разрешается выходить из строя только для подачи команд и проверки их исполнения.\nКоманда разделяется на предварительную и исполнительную; команды могут быть и только исполнительные.\nПредварительная команда подается отчетливо, громко и протяжно, чтобы находящиеся в cтрою поняли, каких действий от них требует командир.\nПо всякой предварительной команде военнослужащие, находящиеся в строю, принимают строевую стойку, в движении переходят на строевой шаг, а вне строя поворачиваются в сторону начальника и принимают строевую стойку.\nПри выполнении приемов с оружием в предварительной команде при необходимости указывается наименование оружия. Например: «Автоматы на - ГРУДЬ». «Пулеметы на ре-МЕНЬ» и так далее.\n20. Чтобы отменить или прекратить выполнение приема, подается команда «ОТСТАВИТЬ». По этой команде принимается положение, которое было до выполнения приема.\nДля участия в парадах, а также в других случаях подразделение по приказу командира может строиться в общую колонну по три, по четыре и более. При этом построение производится, как правило, по росту.\n23. Построение подразделений производится по команде «СТАНОВИСЬ», перед которой указывается порядок построения. Например: «Отделение, в одну шеренгу - СТАНОВИСЬ».\nПо этой команде военнослужащий должен быстро занять свое место в строю, набрать установленные интервал и дистанцию, принять строевую стойку.` }

        const examContent = `Вариант 1.

«ФЗ о Полиции»

1. Представим ситуацию что вы вели погоню за преступником который находится в розыске, какое основание вы ему назовёте при задержаниии?

Пример идеального ответа: «На основании ФЗ о Полиции гл. 4, ст. 7, ч. 2, п. 3»

2. Представим ситуацию что вы вследствие погони за гражданским лицом, применили физическую силу по отношению к нему, для того чтобы его задержать, какое основание вы ему cкажите для того чтобы обосновать ваши действия?

Пример идеального ответа: «Я применил к нему физическую силу на основании гл. 5, ст. 11, ч. 1, п. 2»

3. Представим ситуацию что пока вы задерживали нарушителя и везли его в отдел, он вас всячески оскорблял, кричал, перебивал вас и просто неадекватно вел себя, имеете ли вы право применить по отношению к нему мешок и на каком основании?

Пример идеального ответа: «Да, я имею право применить к нему мешок на основании гл. 3, ст. 6, ч. 4»

4. Вы вели погоню за подозревемым вследствие погони он снес два столба и намерено врезался в автмобили, имеете ли вы право применить табельное оружие для того чтобы остановить его машину?

Пример идеального ответа: Я имею право открыть огонь по его автомобилю или колесам, на основании того что он представлял угрозу жизни граждан.

        // ===== DOM =====
        const btnLectures = document.getElementById('btnLectures');
        const btnExam = document.getElementById('btnExam');
        const lectureGridContainer = document.getElementById('lectureGridContainer');
        const lectureBtns = document.querySelectorAll('.lecture-btn');
        const contentBody = document.getElementById('contentBody');
        const exitBtn = document.getElementById('exitContentBtn');
        const settingsToggle = document.getElementById('settingsToggle');

        function renderContent(title, text) {
            const formatted = text.replace(/\n/g, '<br>');
            contentBody.innerHTML = `
                <h3><i class="fas fa-book"></i> ${title}</h3>
                <div class="content-text">${formatted}</div>
            `;
        }

        function clearActiveLectures() {
            lectureBtns.forEach(b => b.classList.remove('active-lecture'));
        }

        function showLecturesGrid(show) {
            if (show) {
                lectureGridContainer.classList.remove('hidden');
            } else {
                lectureGridContainer.classList.add('hidden');
            }
        }

        function resetAllButtons() {
            btnLectures.classList.remove('active');
            btnExam.classList.remove('active');
        }

        lectureBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.lecture, 10);
                if (isNaN(idx) || idx < 0 || idx >= lectures.length) return;
                clearActiveLectures();
                this.classList.add('active-lecture');
                const lecture = lectures[idx];
                renderContent(lecture.title, lecture.content);
                showLecturesGrid(true);
                resetAllButtons();
                btnLectures.classList.add('active');
                document.getElementById('contentWindow').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        });

        btnLectures.addEventListener('click', function() {
            if (lectureGridContainer.classList.contains('hidden')) {
                showLecturesGrid(true);
            }
            const active = document.querySelector('.lecture-btn.active-lecture');
            if (!active) {
                const firstBtn = document.querySelector('.lecture-btn');
                if (firstBtn) {
                    firstBtn.click();
                } else {
                    renderContent('Лекции', 'Выберите лекцию из списка выше.');
                }
            }
            resetAllButtons();
            this.classList.add('active');
        });

        btnExam.addEventListener('click', function() {
            showLecturesGrid(false);
            clearActiveLectures();
            renderContent('Базовый Экзамен (Вариант 1)', examContent);
            resetAllButtons();
            this.classList.add('active');
            document.getElementById('contentWindow').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        exitBtn.addEventListener('click', function() {
            showLecturesGrid(false);
            clearActiveLectures();
            resetAllButtons();
            contentBody.innerHTML = `
                <h3><i class="fas fa-robot"></i> Добро пожаловать</h3>
                <div class="content-text">Выберите раздел: <strong>Лекции</strong> или <strong>Базовый экзамен</strong>.<br>
                В лекциях доступно 9 материалов. <br> <span class="meta-tag" style="display:inline-block; background:var(--badge-bg); padding:2px 14px; border-radius:40px; font-size:11px; color:var(--badge-text); letter-spacing:0.4px;">ЦППС · v1.3</span></div>
            `;
        });

        // ===== ПЕРЕКЛЮЧЕНИЕ ТЕМЫ =====
        let isDark = false;

        settingsToggle.addEventListener('click', function() {
            isDark = !isDark;
            if (isDark) {
                document.body.classList.add('dark-theme');
                settingsToggle.innerHTML = '<i class="fas fa-sun"></i> Светлая';
            } else {
                document.body.classList.remove('dark-theme');
                settingsToggle.innerHTML = '<i class="fas fa-moon"></i> Тёмная';
            }
            // сохраняем выбор в localStorage
            try {
                localStorage.setItem('cpps-theme', isDark ? 'dark' : 'light');
            } catch(e) {}
        });

        // восстановление темы из localStorage
        try {
            const saved = localStorage.getItem('cpps-theme');
            if (saved === 'dark') {
                isDark = true;
                document.body.classList.add('dark-theme');
                settingsToggle.innerHTML = '<i class="fas fa-sun"></i> Светлая';
            } else {
                settingsToggle.innerHTML = '<i class="fas fa-moon"></i> Тёмная';
            }
        } catch(e) {}

        // инициализация
        showLecturesGrid(false);
        resetAllButtons();
    })();
</script>
